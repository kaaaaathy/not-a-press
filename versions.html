<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>not a press</title>


</head>

<style>
    @font-face {
        font-family: 'courier-sans';
        src: url('courier-prime-sans.regular.ttf');
    }

    @font-face {
        font-family: 'HAL timezone book';
        src: url('HALTimezoneUnlicensed-Book.ttf');
    }

    @font-face {
        font-family: 'HAL timezone regular';
        src: url('HALTimezoneUnlicensed-Regular.ttf');
    }

    html,
    body {
        min-height: 100%;
        background-color: cornflowerblue;
        overscroll-behavior: none;

        text-transform: lowercase;

        /* overflow: hidden; */

    }

    body::selection {
        color: coral;
    }

    body {
        margin: 0px;
        height: 100vh;
        overflow-y: hidden;

    }


    #container {
        display: flex;
        height: 100%;
        width: 100%;
        flex-flow: row nowrap;
        margin: auto;

    }

    marquee {
        height: 27px;
        cursor: pointer;
        user-select: none;
        position: fixed;
        width: 100%;
        top: 0px;
        right: 0px;
        z-index: 10;
        font-family: 'courier-sans';
        font-size: 12px;
        line-height: 18px;
        text-transform: uppercase;
        background: lightgreen;
        color: darkslateblue;
        margin: 0px;
        padding: 0px;
        padding-top: 10px;
        border-bottom: 1px dotted cornflowerblue;

    }



    button {
        font-family: 'courier-sans';
        font-size: 12px;
        text-transform: uppercase;

        padding: 4px;
    }




    .footnote {
        font-family: 'courier-sans', monospace;
        font-size: 12px;
        line-height: 14px;
    }

    section {
        display: flex;
        flex-flow: column nowrap;
        width: 50%;
        border-left: 1px dotted orange;

    }

    #about,
    #events {
        width: 100%;
        background-attachment: fixed;
        color: #483d8b;

    }

    #about {
        height: 60%;

        background-color: #fff8dc;
        /* padding-right: 120px; */

    }


    #events {
        height: 40%;

        background-color: #f9cb9c;
    }

    #examples {
        width: 50%;
        height: 100%;
        background-color: darkslateblue;
        color: cornsilk;
        background-attachment: fixed;



    }



    .seedlings {
        display: block;
        position: fixed;
        bottom: -5px;
        user-select: none;
        color: cornflowerblue;
        font-family: 'courier-sans';
        font-size: 12px;
        text-align: center;

    }

    #thing1,
    #thing2,
    #thing3 {
        border-radius: 2px;
        color: #90ee90;
        background: darkslateblue;
        /* font-family: 'Hal timezone'; */
    }




    @media screen and (max-width: 1200px) {

        #about,
        #examples {
            padding: 0px;
        }
    }

    @media screen and (max-width: 600px) {

        html,
        body {
            overflow: scroll;
            text-align: center;

        }

        section {
            width: 100%;
        }


        #container {
            flex-flow: row wrap;
        }

        #about,
        #examples {
            width: 100%;
            min-height: 700px;
            height: auto;
            border: none;
            padding: 0px 0px;

        }

        iframe {
            border: none;
            min-height: 400px;

        }



        .seedlings {
            width: 100%;
            font-size: 16px;
        }




    }
</style>

<body>

    <div id="container">
        <iframe id="examples" style="border:none"
            src="https://docs.google.com/document/d/e/2PACX-1vRjVj5zbj7A2QazRNtY9kkjj6apZrjAuyUG5zkbX3JFArcKUs1Tuh-zBCzeciKLeRfgKa3BG1vaKUPU/pub?embedded=true">
        </iframe>

        <div class="seedlings">
            ✿&nbsp;&nbsp;&nbsp;✻
            <br>\|/ \|/
        </div>

        <marquee scrollamount="1" behavior="alternate" onclick="generate()">
            translate

            <span id="thing1">...</span>

            into

            <span id="thing2">...</span>
            and then again into

            <span id="thing3">...</span>

    </div>
    </marquee>

    <section>
        <iframe id="about" style="border: none;
" src="https://docs.google.com/document/d/e/2PACX-1vTB18WX7v44JNDIp-Ae3s5MF6QVuWHnOQevzAZTxCRWYZ67_Rd33gilkPEnO4ligFBHR8l-X9brep3l/pub?embedded=true"></iframe>

        <iframe id="events" style="border: none;
" src="https://docs.google.com/document/d/e/2PACX-1vSsKlaHrmo4YQ1qDe6YYP8b0AHKVyq84skCKXSmqfhMnYeCsnqWI5mPXi6qLFOWF-tMF5EvDxcxSF4U/pub?embedded=true"></iframe>
    </section>


    <script src="generator.js"></script>

</html>
